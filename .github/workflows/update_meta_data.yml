name: Atualizar dados Meta Ads

on:
  schedule:
    # Roda todo dia às 08:00 horário de Brasília (11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch:
    # Permite rodar manualmente pelo GitHub quando quiser

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Buscar dados da Meta API
        env:
          META_ACCESS_TOKEN:  ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ID_APCD_1:  ${{ secrets.META_AD_ID_APCD_1 }}
          META_AD_ID_APCD_2:  ${{ secrets.META_AD_ID_APCD_2 }}
          META_AD_ID_APCD_3:  ${{ secrets.META_AD_ID_APCD_3 }}
          META_AD_ID_AUX_1:   ${{ secrets.META_AD_ID_AUX_1 }}
          META_AD_ID_AUX_2:   ${{ secrets.META_AD_ID_AUX_2 }}
          META_AD_ID_AUX_3:   ${{ secrets.META_AD_ID_AUX_3 }}
          META_AD_ID_AUX_4:   ${{ secrets.META_AD_ID_AUX_4 }}
          META_AD_ID_AUX_5:   ${{ secrets.META_AD_ID_AUX_5 }}
        run: python fetch_meta_data.py

      - name: Salvar data.json no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: atualiza data.json $(date +'%d/%m/%Y %H:%M')"
          git push

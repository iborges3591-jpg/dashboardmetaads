name: Buscar Videos Meta Ads

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

jobs:
  videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Buscar videos
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python fetch_videos.py
      - name: Publicar videos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --staged --quiet || git commit -m "Atualizar videos #${{ github.run_number }}"
          git push

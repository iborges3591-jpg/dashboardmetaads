<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico · Meta Ads · Arraes & Centeno</title>
<style>
:root{--navy:#1B3464;--gold:#D4A017;--bg:#EEF2F7;--border:#dde3ed;--muted:#6b7a99;--shadow:0 2px 14px rgba(27,52,100,.10)}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#1c2540}
.top{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1}
.top a{color:#fff;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.k{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.k small{color:var(--muted);font-size:12px;display:block}
.k b{font-size:22px;color:var(--navy)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--border);background:#fff;border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--navy)}
.pill.on{background:var(--navy);color:#fff}
h2{font-size:15px;color:var(--navy);margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border)}
th{background:#f6f8fc;color:var(--muted);font-size:12px}
th:first-child,td:first-child{text-align:left}
tr.row{cursor:pointer}tr.row:hover{background:#f9fbff}
tr.det td{background:#fafbfe;text-align:left;padding:0}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.st.a{background:#d1fae5;color:#065f46}.st.p{background:#fee2e2;color:#991b1b}.st.x{background:#e5e7eb;color:#374151}
.sel{margin-left:6px;font-size:12px}
.inner{width:100%;font-size:12px}.inner th,.inner td{padding:5px 10px}
.foot{color:var(--muted);font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div class="top"><h1>Histórico de campanhas · Meta Ads</h1><a href="index.html">← Voltar ao Dashboard</a></div>
<div class="wrap">
  <div class="sum" id="sum"></div>
  <div class="pills" id="pills"></div>
  <div id="out">Carregando…</div>
  <div class="foot" id="foot"></div>
</div>
<script>
const CATS={apo:'Campanha Aposentadoria PcD',aux:'Campanha Aux.Acidente',trab:'Campanha Ação Trabalhista'};
// Classificação por palavras-chave do nome da campanha; pode ser ajustada manualmente por ID abaixo.
const OVERRIDE={}; // ex.: {'120253919185590635':'apo'}
function cat(a){
  if(OVERRIDE[a.id]) return OVERRIDE[a.id];
  const n=(a.campanha+' '+a.nome).toLowerCase();
  if(/aposent|pcd/.test(n)) return 'apo';
  if(/trabalhista|motorista|acidente de trabalho/.test(n)) return 'trab';
  return 'aux';
}
const R=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const N=v=>v.toLocaleString('pt-BR');
const stInfo=s=>s==='ACTIVE'?['a','Ativa']:(/PAUSED/.test(s)?['p','Pausada']:['x',s==='ARCHIVED'?'Arquivada':s]);
function tot(a){const t={g:0,v:0,c:0,cv:0};a.daily.forEach(x=>{t.g+=x.spent;t.v+=x.views;t.c+=x.clicks;t.cv+=x.convs});return t}
let D,filtro='todos',stf='todos';
function render(){
  const list=D.anuncios.filter(a=>a.daily.length&&(filtro==='todos'||cat(a)===filtro)&&(stf==='todos'||(stf==='ativas'?a.status==='ACTIVE':a.status!=='ACTIVE')));
  const T=list.reduce((s,a)=>{const t=tot(a);s.g+=t.g;s.v+=t.v;s.c+=t.c;s.cv+=t.cv;return s},{g:0,v:0,c:0,cv:0});
  document.getElementById('sum').innerHTML=
   [['Investido',R(T.g)],['Visualizações',N(T.v)],['Cliques',N(T.c)],['Conversas',N(T.cv)],['Custo / conversa',T.cv?R(T.g/T.cv):'—'],['Anúncios',list.length]]
   .map(([l,v])=>`<div class="k"><small>${l}</small><b>${v}</b></div>`).join('');
  let h='';
  for(const c of ['apo','aux','trab']){
    const L=list.filter(a=>cat(a)===c).sort((a,b)=>b.criado.localeCompare(a.criado));
    if(!L.length) continue;
    h+=`<h2>${CATS[c]}</h2><table><tr><th>Campanha</th><th>Status</th><th>Criada</th><th>Gasto</th><th>Views</th><th>Cliques</th><th>Conversas</th><th>Custo/conv.</th></tr>`;
    for(const a of L){
      const t=tot(a),[k,l]=stInfo(a.status),i=D.anuncios.indexOf(a);
      h+=`<tr class="row" onclick="tg(${i})"><td>${a.campanha.replace(/</g,'&lt;')}</td><td><span class="st ${k}">${l}</span></td><td>${a.criado.split('-').reverse().join('/')}</td><td>${R(t.g)}</td><td>${N(t.v)}</td><td>${N(t.c)}</td><td>${N(t.cv)}</td><td>${t.cv?R(t.g/t.cv):'—'}</td></tr>`;
      h+=`<tr class="det" id="d${i}" style="display:none"><td colspan="8"><table class="inner"><tr><th>Dia</th><th>Gasto</th><th>Views</th><th>Cliques</th><th>Conversas</th><th>Custo/conv.</th></tr>${[...a.daily].reverse().map(x=>`<tr><td>${x.date}</td><td>${R(x.spent)}</td><td>${N(x.views)}</td><td>${N(x.clicks)}</td><td>${N(x.convs)}</td><td>${x.convs?R(x.spent/x.convs):'—'}</td></tr>`).join('')}</table></td></tr>`;
    }
    h+='</table>';
  }
  document.getElementById('out').innerHTML=h||'Nenhum dado.';
}
function tg(i){const e=document.getElementById('d'+i);e.style.display=e.style.display==='none'?'':'none'}
function pills(){
  const P=[['todos','Todas'],['apo','Aposentadoria PcD'],['aux','Aux.Acidente'],['trab','Ação Trabalhista']];
  document.getElementById('pills').innerHTML=P.map(([k,l])=>`<button class="pill ${filtro===k?'on':''}" onclick="filtro='${k}';pills();render()">${l}</button>`).join('')+
   '<select class="pill sel" onchange="stf=this.value;render()"><option value="todos">Ativas + inativas</option><option value="ativas">Só ativas</option><option value="inativas">Só inativas</option></select>';
}
fetch('historico.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;
  document.getElementById('foot').textContent='Período desde '+d.desde.split('-').reverse().join('/')+' · gerado em '+d.gerado_em+' · clique numa campanha para ver o detalhe diário.';
  pills();render()}).catch(e=>document.getElementById('out').textContent='Erro ao carregar historico.json');
</script>
</body>
</html>
